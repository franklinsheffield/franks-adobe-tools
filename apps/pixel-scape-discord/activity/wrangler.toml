# Pixel Scape Activity (Discord D3): the web build + sign-in. Deployed by .github/workflows/pixel-scape-deploy.yml
name = "pixel-scape-activity"
main = "worker.mjs"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "../../worlds-brew-app/web/dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/.proxy/api/*"]

[vars]
DISCORD_APP_ID = "1575319071283617842"
# Role gate (Science is Magic server): Pixel Scape Access, Hierophant, Patron of the Lab
GATE_GUILD_ID = "1530029383404884069"
GATE_ROLE_IDS = "1575316203621060638,1574485334014558290,1575350660277211266"
GATE_MESSAGE = "Pixel Scape is sealed. Unlock it in Science is Magic: boost the server (Patron of the Lab) or earn the Pixel Scape Access role."
# Secret (set by the deploy workflow): DISCORD_CLIENT_SECRET

[observability]
enabled = true
