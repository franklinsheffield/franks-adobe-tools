<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oracle Chamber</title>
<link rel="stylesheet" href="chamber.css">
</head>
<body>
<main id="stage" class="stage">
  <canvas id="stars" class="stars" aria-hidden="true"></canvas>
  <div id="teller" class="teller" role="img" aria-label="The Oracle, a hooded fortune teller behind a crystal ball"></div>
  <div id="poof" class="poof" aria-hidden="true"></div>
  <button id="journal-btn" class="corner" type="button">📖 Journal</button>
  <section class="dialog" aria-live="polite" aria-label="The Oracle speaks">
    <div class="speaker">THE ORACLE</div>
    <div id="say" class="say"></div>
    <div id="ui"></div>
  </section>
</main>
<section id="reading" class="reading" hidden aria-label="Your reading">
  <div class="reading-inner">
    <div class="reading-bar"><button type="button" class="c" id="close-reading">← Back to the Oracle</button></div>
    <div id="reading-body"></div>
  </div>
</section>
<script type="module" src="chamber.js"></script>
</body>
</html>
