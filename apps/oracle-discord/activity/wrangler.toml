# Oracle Chamber (Discord Activity for the Science is Magic Oracle). Deployed by .github/workflows/oracle-deploy.yml.
name = "oracle-chamber"
main = "worker.mjs"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/.proxy/api/*"]

[vars]
DISCORD_APP_ID = "1575582995878772789"

# Same saved-profiles namespace as the bot (the deploy workflow fills in its id).
[[kv_namespaces]]
binding = "PROFILES"
id = "KV_ID_SET_BY_DEPLOY"

# Multiplayer: one Durable Object per call and game holds that game's table (tables.mjs; SQLite-backed, free plan).
# Local test tables without Discord: wrangler dev --var DEV_ROOMS:1
[[durable_objects.bindings]]
name = "TABLES"
class_name = "Tables"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Tables"]

# Secrets (set by the deploy workflow): ORACLE_KEY, DISCORD_CLIENT_SECRET (optional until sign-in is set up)

[observability]
enabled = true
