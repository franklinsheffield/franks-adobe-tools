# Tests the Science is Magic oracle bot, deploys its Cloudflare Worker and registers the slash commands.
name: Oracle bot deploy
on:
  push:
    branches: [main]
    paths: ["apps/oracle-discord/**", ".github/workflows/oracle-*.yml"]
  pull_request:
    paths: ["apps/oracle-discord/**", ".github/workflows/oracle-*.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: apps/oracle-discord } }
    env:
      HAVE_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.ORACLE_DISCORD_PUBLIC_KEY != '' && secrets.ORACLE_DISCORD_BOT_TOKEN != '' && secrets.GH_DISPATCH_TOKEN != '' }}
      IS_MAIN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/oracle-discord/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Secrets missing
        if: env.HAVE_SECRETS != 'true'
        run: echo "::warning::Oracle bot secrets not set yet; tests passed, deploy skipped."
      - name: Sealing key (ORACLE_KEY secret, or derived from the bot token)
        env:
          K: ${{ secrets.ORACLE_KEY }}
          T: ${{ secrets.ORACLE_DISCORD_BOT_TOKEN }}
        if: env.HAVE_SECRETS == 'true' && env.IS_MAIN == 'true'
        run: |
          if [ -z "$K" ] && [ -n "$T" ]; then K=$(printf %s "$T" | openssl dgst -sha256 -hmac science-is-magic-oracle-seal -binary | base64); fi
          echo "::add-mask::$K"
          echo "ORACLE_KEY=$K" >> "$GITHUB_ENV"
      - name: Saved-profiles KV namespace (create once, fill in its id)
        if: env.HAVE_SECRETS == 'true' && env.IS_MAIN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?per_page=100" | jq -r '.result[] | select(.title=="oracle-profiles") | .id' | head -1)
          if [ -z "$ID" ]; then
            ID=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" --data '{"title":"oracle-profiles"}' "$API" | jq -r '.result.id')
          fi
          test -n "$ID" && test "$ID" != "null"
          sed -i "s/KV_ID_SET_BY_DEPLOY/$ID/" wrangler.toml activity/wrangler.toml
          echo "KV namespace oracle-profiles: $ID"
      - name: Deploy Worker
        if: env.HAVE_SECRETS == 'true' && env.IS_MAIN == 'true'
        id: wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/oracle-discord
          secrets: |
            DISCORD_PUBLIC_KEY
            GH_DISPATCH_TOKEN
            ORACLE_KEY
        env:
          DISCORD_PUBLIC_KEY: ${{ secrets.ORACLE_DISCORD_PUBLIC_KEY }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          ORACLE_KEY: ${{ env.ORACLE_KEY }}
      - name: Build the Oracle Chamber (Activity)
        if: env.HAVE_SECRETS == 'true' && env.IS_MAIN == 'true'
        run: node activity/build.mjs
      - name: Deploy the Oracle Chamber Worker
        if: env.HAVE_SECRETS == 'true' && env.IS_MAIN == 'true'
        id: chamber
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/oracle-discord/activity
          wranglerVersion: "4.150.0"
          secrets: |
            ORACLE_KEY
            ${{ secrets.ORACLE_DISCORD_CLIENT_SECRET != '' && 'DISCORD_CLIENT_SECRET' || '' }}
            DISCORD_BOT_TOKEN
        env:
          ORACLE_KEY: ${{ env.ORACLE_KEY }}
          DISCORD_CLIENT_SECRET: ${{ secrets.ORACLE_DISCORD_CLIENT_SECRET }}
          DISCORD_BOT_TOKEN: ${{ secrets.ORACLE_DISCORD_BOT_TOKEN }}
      - name: Register slash commands
        if: env.HAVE_SECRETS == 'true' && env.IS_MAIN == 'true'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.ORACLE_DISCORD_BOT_TOKEN }}
        run: npm run register
      - name: Interactions endpoint URL
        if: env.HAVE_SECRETS == 'true' && env.IS_MAIN == 'true'
        run: |
          echo "Discord Developer Portal > General Information > Interactions Endpoint URL:" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.wrangler.outputs.deployment-url }}' >> "$GITHUB_STEP_SUMMARY"
          echo "Oracle Chamber (Activities > URL Mappings, root /): ${{ steps.chamber.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
