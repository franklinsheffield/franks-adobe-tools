# House gate setup for the Oracle Chamber (apps/oracle-discord/scripts/house-gate-setup.js). Run by hand only.
#   roles: create the House gate roles and save ROLE_IDS / LEVEL_GRANTS to the Worker (gate stays off)
#   on:    the same, then switch the gate on (SWITCH_AT = the Founding Member cut-off; blank = now)
#   off:   switch the gate off (kill switch)
name: House gate
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "roles | on | off"
        required: true
        default: roles
        type: choice
        options: [roles, "on", "off"]
      switch_at:
        description: "Founding cut-off (ISO time). Members who joined before it start at level 4. Blank = now (only used with on)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: apps/oracle-discord } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Roles, grants and gate settings
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.ORACLE_DISCORD_BOT_TOKEN }}
          SWITCH_AT: ${{ inputs.switch_at }}
          SECRETS_OUT: ${{ runner.temp }}/house-gate.json
        run: node scripts/house-gate-setup.js "${{ inputs.mode }}"
      - name: Save to the Oracle Chamber Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.150.0 secret bulk "${{ runner.temp }}/house-gate.json" --name oracle-chamber
          rm -f "${{ runner.temp }}/house-gate.json"
          echo "House gate: ${{ inputs.mode }} done" >> "$GITHUB_STEP_SUMMARY"
