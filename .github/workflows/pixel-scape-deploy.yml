# Tests the Pixel Scape Discord bot, deploys its Cloudflare Worker and registers the slash commands.
name: Pixel Scape bot deploy
on:
  push:
    branches: [main]
    paths: ["apps/pixel-scape-discord/**", "apps/worlds-brew-app/**", "plugins/worlds-brew/**", "shared/**", ".github/workflows/pixel-scape-*.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: apps/pixel-scape-discord } }
    env:
      HAVE_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.DISCORD_PUBLIC_KEY != '' && secrets.GH_DISPATCH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/pixel-scape-discord/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Secrets missing
        if: env.HAVE_SECRETS != 'true'
        run: echo "::warning::Bot secrets not set yet; tests passed, deploy skipped."
      - name: Deploy Worker
        if: env.HAVE_SECRETS == 'true'
        id: wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/pixel-scape-discord
          secrets: |
            DISCORD_PUBLIC_KEY
            DISCORD_APP_ID
            GH_DISPATCH_TOKEN
        env:
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
      - name: Build the Pixel Scape web version (Activity)
        working-directory: apps/worlds-brew-app
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: "1" }
        run: |
          npm ci --no-audit --no-fund
          npm run web
      - name: Deploy the Activity Worker
        if: env.HAVE_SECRETS == 'true'
        id: activity
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/pixel-scape-discord/activity
          wranglerVersion: "4.150.0"
          secrets: |
            ${{ secrets.DISCORD_CLIENT_SECRET != '' && 'DISCORD_CLIENT_SECRET' || '' }}
            ${{ secrets.DISCORD_BOT_TOKEN != '' && 'DISCORD_BOT_TOKEN' || '' }}
        env:
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      - name: Register slash commands
        if: env.HAVE_SECRETS == 'true'
        env:
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: npm run register
      - name: Interactions endpoint URL
        if: env.HAVE_SECRETS == 'true'
        run: |
          echo "Paste this into Discord Developer Portal > General Information > Interactions Endpoint URL:" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.wrangler.outputs.deployment-url }}' >> "$GITHUB_STEP_SUMMARY"
          echo "Activity URL mapping root (/): ${{ steps.activity.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
